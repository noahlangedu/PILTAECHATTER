
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090914">
  <title>PILTAE CHATTER</title>

  <style>
    :root {
      --bg: #090914;
      --panel: #141426;
      --panel2: #1c1c34;
      --purple: #a16aff;
      --cyan: #54e6ff;
      --text: #f4f0ff;
      --muted: #a8a3c5;
      --border: #34304e;
      --red: #ff8298;
      --green: #70f5b1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #261343 0%, transparent 52%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, Arial, sans-serif;
    }

    button, input { font: inherit; }

    header {
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
      background: #090914d9;
    }

    .container {
      width: min(1000px, 92%);
      margin: auto;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .brand span, .accent { color: var(--purple); }

    .tagline {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    main { padding: 38px 0; }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-size: clamp(35px, 7vw, 60px);
      letter-spacing: -2px;
      margin: 0 0 10px;
    }

    .hero p, .muted {
      color: var(--muted);
      line-height: 1.65;
    }

    .card {
      background: linear-gradient(145deg, #19192e, #10101e);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 15px 45px #0003;
    }

    .auth-card {
      width: min(450px, 100%);
      margin: auto;
    }

    h2 { margin-top: 0; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 13px;
      color: var(--text);
      background: #0a0a17;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px #a16aff22;
    }

    .btn {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(100deg, #7c3aed, #a855f7);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .btn.secondary {
      background: var(--panel2);
      border: 1px solid var(--border);
    }

    .btn:disabled { opacity: .6; cursor: wait; }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .link {
      background: none;
      border: 0;
      color: var(--cyan);
      padding: 5px;
      cursor: pointer;
      font-weight: 700;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      line-height: 1.6;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }

    .message.error {
      color: #ffb6c3;
      border: 1px solid #ff829855;
      background: #ff829811;
    }

    .message.success {
      color: var(--green);
      border: 1px solid #70f5b155;
      background: #70f5b111;
    }

    .message.info {
      color: #b9f5ff;
      border: 1px solid #54e6ff55;
      background: #54e6ff11;
    }

    .hidden { display: none !important; }

    .dashboard-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .badge {
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 10px;
      margin: 20px 0;
    }

    .nav button {
      padding: 13px 9px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--panel2);
      cursor: pointer;
    }

    .nav button:hover { border-color: var(--purple); }

    .feature {
      background: #0d0d1b;
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 25px 0 35px;
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="brand">PILTAE <span>CHATTER</span></div>
      <div class="tagline">YOUR SPACE. YOUR PEOPLE. YOUR COMMUNITY.</div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>WELCOME TO <span class="accent">PILTAE</span></h1>
      <p>A place for your community to connect.</p>
    </section>

    <section id="authPanel" class="card auth-card">
      <h2 id="authTitle">Sign in</h2>
      <p id="authDescription" class="muted">
        Welcome back. Sign in to continue.
      </p>

      <form id="authForm">
        <div id="nameField" class="hidden">
          <label for="displayName">Display name</label>
          <input
            id="displayName"
            type="text"
            maxlength="32"
            autocomplete="nickname"
            placeholder="Your public name"
          >
        </div>

        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          minlength="6"
          autocomplete="current-password"
          required
          placeholder="Your password"
        >

        <button id="submitButton" class="btn" type="submit">
          Sign in
        </button>
      </form>

      <button id="resetButton" class="btn secondary" type="button">
        Reset password
      </button>

      <div id="authMessage" class="message" role="status" aria-live="polite"></div>

      <div class="switch">
        <span id="switchText">New here?</span>
        <button id="switchButton" class="link" type="button">
          Create account
        </button>
      </div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card">
        <div class="dashboard-top">
          <div>
            <h2>Welcome, <span id="welcomeName">Member</span></h2>
            <div id="profileStatus" class="muted"></div>
          </div>
          <span class="badge">● SIGNED IN</span>
        </div>

        <button id="signOutButton" class="btn secondary" type="button">
          Sign out
        </button>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <button data-section="community">Community</button>
        <button data-section="messages">Messages</button>
        <button data-section="friends">Friends</button>
        <button data-section="groups">Groups</button>
        <button data-section="wallet">Wallet</button>
        <button data-section="leaderboard">Leaderboard</button>
        <button data-section="events">Events</button>
        <button data-section="mines">Mines</button>
        <button data-section="shop">Shop</button>
        <button data-section="profile">Profile</button>
      </nav>

      <section class="card">
        <h2 id="sectionTitle">Community</h2>
        <p id="sectionDescription" class="muted"></p>
        <div id="sectionContent"></div>
      </section>
    </section>
  </main>

  <footer>PILTAE CHATTER · Built for the community</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://erdmambofrurnieznurd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_pJMItt5PjLrsuFxStW2YNQ_OrJNJqpv";

    const SITE_URL =
      "https://noahlangedu.github.io/piltaechatter/";

    let supabase = null;
    let currentUser = null;
    let loginMode = true;
    let authListenerRegistered = false;

    const $ = (id) => document.getElementById(id);

    function message(id, text, type = "info") {
      const el = $(id);
      el.textContent = text;
      el.className = "message show " + type;
    }

    function clearMessage(id) {
      $(id).textContent = "";
      $(id).className = "message";
    }

    function cleanName(value) {
      return String(value || "").trim().replace(/\s+/g, " ").slice(0, 32);
    }

    function fallbackName(user) {
      return cleanName(user?.user_metadata?.display_name) ||
        cleanName(user?.user_metadata?.username) ||
        "Member";
    }

    function showAuth() {
      $("authPanel").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
    }

    function showDashboard() {
      $("authPanel").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
    }

    function setMode(isLogin) {
      loginMode = isLogin;

      $("authTitle").textContent = isLogin ? "Sign in" : "Create account";
      $("authDescription").textContent = isLogin
        ? "Welcome back. Sign in to continue."
        : "Choose the display name people will see.";

      $("submitButton").textContent = isLogin
        ? "Sign in"
        : "Create account";

      $("switchText").textContent = isLogin
        ? "New here?"
        : "Already have an account?";

      $("switchButton").textContent = isLogin
        ? "Create account"
        : "Sign in";

      $("nameField").classList.toggle("hidden", isLogin);
      $("displayName").required = !isLogin;
      $("password").autocomplete = isLogin
        ? "current-password"
        : "new-password";

      clearMessage("authMessage");
    }

    function authError(error) {
      const raw = String(error?.message || "");
      const lower = raw.toLowerCase();

      console.error("PILTAE CHATTER authentication error:", {
        message: raw,
        code: error?.code,
        status: error?.status
      });

      if (
        lower.includes("invalid login credentials") ||
        lower.includes("invalid credentials")
      ) {
        return "Incorrect email or password. Check your details and try again.";
      }

      if (lower.includes("email not confirmed")) {
        return "Your email is not confirmed. Open your latest confirmation email and follow its link.";
      }

      if (
        lower.includes("rate limit") ||
        lower.includes("too many requests")
      ) {
        return "Supabase has temporarily limited email requests. Wait before trying again, or configure custom SMTP in Supabase.";
      }

      if (
        lower.includes("already registered") ||
        lower.includes("already been registered")
      ) {
        return "This email already has an account. Switch to Sign in.";
      }

      if (
        lower.includes("row-level security") ||
        lower.includes("permission denied") ||
        lower.includes("violates row-level security")
      ) {
        return "Your account signed in, but the profile database denied access. Check the profiles table policies and rerun the provided profile SQL.";
      }

      if (lower.includes("network") || lower.includes("fetch")) {
        return "Could not connect to Supabase. Check your connection and reload.";
      }

      return raw
        ? "Request failed: " + raw
        : "Something went wrong. Open your browser console for details.";
    }

    async function saveProfile(user, requestedName = "") {
      const nameFromForm = cleanName(requestedName);
      const metadataName = fallbackName(user);
      const chosenName = nameFromForm || metadataName;

      // Read the user's existing profile first so existing names are preserved.
      const { data: existing, error: readError } = await supabase
        .from("profiles")
        .select("id, username, display_name")
        .eq("id", user.id)
        .maybeSingle();

      if (readError) {
        console.error("Profile read error:", readError);
        $("profileStatus").textContent =
          "Signed in, but the profile could not be loaded. Check the profiles table and its policies.";
        $("welcomeName").textContent = chosenName;
        return;
      }

      const savedName =
        nameFromForm ||
        cleanName(existing?.display_name) ||
        cleanName(existing?.username) ||
        metadataName;

      // Upsert creates a missing row or updates the name in an existing row.
      const { data, error } = await supabase
        .from("profiles")
        .upsert(
          {
            id: user.id,
            username: savedName,
            display_name: savedName
          },
          { onConflict: "id" }
        )
        .select("id, username, display_name")
        .single();

      if (error) {
        console.error("Profile save error:", error);
        $("welcomeName").textContent = savedName;
        $("profileStatus").textContent =
          "Signed in, but saving the display name failed. Check the profiles schema, unique ID, and security policies.";
        return;
      }

      $("welcomeName").textContent =
        cleanName(data.display_name) ||
        cleanName(data.username) ||
        savedName;

      $("profileStatus").textContent = "Your profile is ready.";
    }

    async function enterDashboard(user, preferredName = "") {
      if (!user) return;

      currentUser = user;
      showDashboard();

      // Email is intentionally not shown in the dashboard.
      $("welcomeName").textContent =
        cleanName(preferredName) || fallbackName(user);

      $("profileStatus").textContent = "Loading profile...";
      await saveProfile(user, preferredName);
      showSection("community");
    }

    const sections = {
      community: [
        "Community",
        "The community chat interface still needs to be connected to your chat_messages table."
      ],
      messages: [
        "Private Messages",
        "Private messaging needs its own interface and database policies."
      ],
      friends: [
        "Friends",
        "Friend requests and friendships need to be connected."
      ],
      groups: [
        "Groups",
        "Group creation, invitations, and membership controls need to be connected."
      ],
      wallet: [
        "Wallet",
        "Coin balances and payments must be validated securely on the server."
      ],
      leaderboard: [
        "Leaderboard",
        "Leaderboard data needs to be connected to your database."
      ],
      events: [
        "Events",
        "Event creation and attendance features need to be connected."
      ],
      mines: [
        "Mines",
        "The game needs secure server-side game and payout logic."
      ],
      shop: [
        "Shop",
        "Shop inventory and purchases need server-side validation."
      ],
      profile: [
        "Profile",
        "Your display name is shown above. Profile editing can be added next."
      ]
    };

    function showSection(key) {
      const selected = sections[key] || sections.community;
      $("sectionTitle").textContent = selected[0];
      $("sectionDescription").textContent = selected[1];

      const content = $("sectionContent");
      content.replaceChildren();

      const card = document.createElement("div");
      card.className = "feature";

      const title = document.createElement("strong");
      title.textContent = selected[0];

      const description = document.createElement("p");
      description.className = "muted";
      description.textContent = selected[1];

      card.append(title, description);
      content.appendChild(card);
    }

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabase) {
        message("authMessage", "Supabase is not ready. Reload the page.", "error");
        return;
      }

      const email = $("email").value.trim();
      const password = $("password").value;
      const displayName = cleanName($("displayName").value);
      const submit = $("submitButton");

      if (!loginMode && !displayName) {
        message("authMessage", "Enter a display name first.", "error");
        return;
      }

      submit.disabled = true;
      submit.textContent = loginMode ? "Signing in..." : "Creating account...";
      clearMessage("authMessage");

      try {
        if (loginMode) {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          await enterDashboard(data.user);
          message("authMessage", "Signed in successfully.", "success");
        } else {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: SITE_URL,
              data: {
                display_name: displayName,
                username: displayName
              }
            }
          });

          if (error) throw error;

          if (data.session && data.user) {
            await enterDashboard(data.user, displayName);
            message("authMessage", "Account created successfully.", "success");
          } else {
            message(
              "authMessage",
              "Signup submitted. Check your email and confirm your account before signing in. If no email arrives, check Supabase's email settings and rate limits.",
              "success"
            );
          }
        }
      } catch (error) {
        message("authMessage", authError(error), "error");
      } finally {
        submit.disabled = false;
        submit.textContent = loginMode ? "Sign in" : "Create account";
      }
    });

    $("switchButton").addEventListener("click", () => {
      setMode(!loginMode);
    });

    $("resetButton").addEventListener("click", async () => {
      if (!supabase) return;

      const email = $("email").value.trim();

      if (!email) {
        message("authMessage", "Enter your email address first.", "error");
        $("email").focus();
        return;
      }

      $("resetButton").disabled = true;

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: SITE_URL
        });

        if (error) throw error;

        message(
          "authMessage",
          "If a reset email can be sent for this account, it will arrive shortly. Check your inbox and spam folder.",
          "success"
        );
      } catch (error) {
        message("authMessage", authError(error), "error");
      } finally {
        $("resetButton").disabled = false;
      }
    });

    $("signOutButton").addEventListener("click", async () => {
      if (!supabase) return;

      $("signOutButton").disabled = true;

      try {
        const { error } = await supabase.auth.signOut();
        if (error) throw error;

        currentUser = null;
        showAuth();
        setMode(true);
        message("authMessage", "Signed out successfully.", "success");
      } catch (error) {
        message("authMessage", authError(error), "error");
      } finally {
        $("signOutButton").disabled = false;
      }
    });

    document.querySelectorAll("[data-section]").forEach((button) => {
      button.addEventListener("click", () => showSection(button.dataset.section));
    });

    async function initialize() {
      if (!window.supabase?.createClient) {
        message(
          "authMessage",
          "The Supabase library did not load. Check your internet connection and reload.",
          "error"
        );
        return;
      }

      try {
        supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );

        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;

        if (data.session?.user) {
          await enterDashboard(data.session.user);
        } else {
          showAuth();
        }

        if (!authListenerRegistered) {
          authListenerRegistered = true;

          supabase.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_OUT") {
              currentUser = null;
              showAuth();
            }
          });
        }
      } catch (error) {
        console.error("Initialization error:", error);
        message(
          "authMessage",
          "Could not initialize your session. Reload and try again.",
          "error"
        );
      }
    }

    setMode(true);
    initialize();
  </script>
</body>
</html>
