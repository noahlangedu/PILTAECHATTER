
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <title>PILTAE CHATTER</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090b12;
      --panel: #111521;
      --panel2: #171d2c;
      --border: #283146;
      --text: #eef2ff;
      --muted: #8d98b3;
      --accent: #8b5cf6;
      --cyan: #22d3ee;
      --green: #34d399;
      --red: #fb7185;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #17152e, var(--bg) 58%);
      color: var(--text);
      font-family: Inter, system-ui, Arial, sans-serif;
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 6%;
      border-bottom: 1px solid var(--border);
      background: #090b12dd;
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(16px);
    }
    .brand {
      font-weight: 950;
      letter-spacing: 2px;
      font-size: 20px;
    }
    .brand span { color: var(--accent); }
    .status {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
    }
    .dot.online { background: var(--green); }

    main { width: min(1200px, 92%); margin: 36px auto; }
    .hero {
      padding: 35px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(130deg, #17182c, #101522 65%);
      position: relative;
      overflow: hidden;
    }
    .hero:after {
      content: "";
      position: absolute;
      width: 240px; height: 240px;
      right: -100px; top: -100px;
      background: var(--accent);
      filter: blur(110px);
      opacity: .35;
      pointer-events: none;
    }
    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 800;
    }
    h1 { font-size: clamp(32px, 5vw, 54px); margin: 12px 0; letter-spacing: -2px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); line-height: 1.65; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      margin-top: 22px;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 23px;
      background: #111521eF;
      min-width: 0;
    }
    h2 { font-size: 18px; margin: 0 0 16px; }
    h3 { font-size: 14px; margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    .field { display: grid; gap: 7px; margin: 14px 0; }
